<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>DogShare</title>
</head>
<body>
    <nav>
        <div class="navbarcollapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="#">Feed</a>
                </li>
                <li class="nav-item">
                <a id="navreg" class="nav-link" href="#">Register</a>
                </li>
                <li>
                <a id="navlogin" class="nav-link" href="#">Login</a>
                </li>
                <li><a class="nav-link" href=""><p class="usernameuser"></p></a></li>
                <li>
                <a class="nav-link" id="postbtn" href="">Post</a>
                </li>
                <li>
                <a class="nav-link" href=""></a>
                </li>
                <li>
                <a id="navlogout" class="nav-link" href="">Logout</a>
                </li>
            </ul>
            </div>
    </nav>



    <div>
    <form class="regform" action="">
        <h1>register</h1>
        <label autocomplete="email" for="">Email</label>
        <input required placeholder="Email" class="email" type="email" name="" id="">
        <label for="">Password</label>
        <input autocomplete="new-password" required placeholder="Password" class="password" type="password" name="" id="">
        <input type="submit" value="Submit">
        <p class="responcetxt"></p>
    </form>

    <form class="loginform" action="">
        <h1>log in</h1>
        <label for="">Email</label>
        <input autocomplete="email"  required placeholder="Email" class="emaillog" type="email" name="" id="">
        <label for="">Password</label>
        <input autocomplete="current-password" required placeholder="Password" class="passwordlog" type="password" name="" id="">
        <input type="submit" value="Submit">
        <p class="responcetxtlog"></p>
    </form>
    </div>

    <div class="postpopup">
        <div class="postbox">
        <button class="closepostpopup"><i class="fa-solid fa-xmark"></i></button>
        <input class="inpTitle" placeholder="Title" type="text">
        <input class="inpDescription" placeholder="Description" type="text">
        <button><a href="https://imgbb.com/" target="_blank">Image link</a></button>
        <input class="inpImage" placeholder="Image" type="text">
        <button class="PostSubmit">submit</button>
        </div>
    </div>


    <div class="userpopup">
        <div class="userbox">
        <button class="closeuserpopup"><i class="fa-solid fa-xmark"></i></button>
        <h1>Email:</h1>
        <h3 class="emailview"></h3>
        <h3>Posts:</h3>
        <div class="userposts"></div>
        </div>
    </div>

    <h1 style="text-align: center;">feed</h1>
    <div class="posts"></div>


    <div class="userpage"></div>

    <script src="main.js"></script>


    </div>
    <script async src="//s.imgur.com/min/embed.js" charset="utf-8"></script>

</body>
</html>
