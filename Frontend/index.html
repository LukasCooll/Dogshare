<html lang="en">
<head>

    <title>DogShare</title>
</head>
<body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">DogShare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="#">Feed</a>
                </li>
                <li class="nav-item">
                <a id="navreg" class="nav-link" href="#">Register</a>
                </li>
                <li>
                <a id="navlogin" class="nav-link" href="#">Login</a>
                </li>
                <li><a class="nav-link" href=""><p class="usernameuser"></p></a></li>

    <div>
    <form class="regform" action="">
        <h1>register</h1>
        <label autocomplete="email" for="">Email</label>
        <input required placeholder="Email" class="email" type="email" name="" id="">
        <label for="">Password</label>
        <input autocomplete="new-password" required placeholder="Password" class="password" type="password" name="" id="">
        <input type="submit" value="Submit">
        <p class="responcetxt"></p>
    </form>

    <form class="loginform" action="">
        <h1>log in</h1>
        <label for="">Email</label>
        <input autocomplete="email"  required placeholder="Email" class="emaillog" type="email" name="" id="">
        <label for="">Password</label>
        <input autocomplete="current-password" required placeholder="Password" class="passwordlog" type="password" name="" id="">
        <input type="submit" value="Submit">
        <p class="responcetxtlog"></p>
    </form>
    </div>

    <h1>feed</h1>
    <div class="posts"></div>

    <div class="userpage"></div>
    

    <script src="main.js"></script>
</body>
</html>
